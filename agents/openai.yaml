interface:
  display_name: "1C Universal Dev"
  short_description: "Роутер 1С: разработка, анализ кода, формы, права, СКД, качество и PM-ветки"
  default_prompt: "Используй $1c-universal-dev для задач 1С. Укажи режим: создание/new/xml/epf/erf, код/code, запрос/query, форма/form, архитектура/architecture, права/rights, скд/report, интеграция/integration, расширение/ext, производительность/perf, тесты/testing, диагностика/audit, тз/spec, оценка/estimate или приемка/acceptance/release/status. Для внешней обработки или отчета используй XML-каталог `ШАБЛОН_*`, итоговый каталог обязательно переименуй логически под задачу; бинарный .epf/.erf пользователь формирует сам в Конфигураторе. Skill работает безопасно: без скриптов, автоустановок и изменений среды без явной команды. В начале 1С-задачи учитывай `user-context/user-preferences.yaml`; если EDT не зафиксирован, спроси один раз и сохрани ответ."
policy:
  allow_implicit_invocation: true